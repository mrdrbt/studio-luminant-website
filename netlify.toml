[build]
  publish = "."

# ─── Pretty URLs OFF ───
# Netlify's post-processing was rewriting every internal link from
# href="koleksiyon.htm" to href='/koleksiyon', while every canonical tag and
# every sitemap <loc> still points at the .htm form. Both forms return 200, so
# the canonical URLs received ZERO internal links — Ahrefs flagged all 41 pages
# as "Canonical URL has no incoming internal links" (crawl depth 0, discovered
# only via sitemap). Turning this off makes served links match canonical.
[build.processing.html]
  pretty_urls = false

# ─── Domain cutover: studioluminant.com → studioluminant.com.tr (permanent 301) ───
# .com still resolves to this Netlify site; force-redirect every old-domain
# request to the new domain, path-preserved, so the old domain stops serving
# duplicate content and consolidates to .com.tr.
[[redirects]]
  from = "https://studioluminant.com/*"
  to = "https://studioluminant.com.tr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.studioluminant.com/*"
  to = "https://studioluminant.com.tr/:splat"
  status = 301
  force = true

# Redirect www to non-www (canonical)
[[redirects]]
  from = "https://www.studioluminant.com.tr/*"
  to = "https://studioluminant.com.tr/:splat"
  status = 301
  force = true

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.facebook.com; connect-src 'self' https://mjmeqgljpyenuqorarte.supabase.co https://formspree.io https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://www.facebook.com https://connect.facebook.net; frame-src 'none'; form-action 'self' https://formspree.io; base-uri 'self'; object-src 'none'"

# Long cache for images (1 year, immutable content-hashed filenames)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache CSS/JS for 1 week (content changes with deploys)
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Public launch PDF, «Çizimden Duvara» / From Drawing to Wall (DEC-05, WB-15): served with noindex.
# Files: /pdf/SL_Cizimden-Duvara_2026-10_TR.pdf and /pdf/SL_From-Drawing-to-Wall_2026-10_EN.pdf (P-07).
# /pdf/ must stay out of robots.txt (a blocked URL never shows the header) and out of both sitemaps.
# Public edition only: the private edition is never hosted.
[[headers]]
  for = "/pdf/*"
  [headers.values]
    X-Robots-Tag = "noindex"

