[build]
  publish = "."

# ─── Pretty URLs OFF ───
# Netlify's post-processing was rewriting every internal link from
# href="koleksiyon.htm" to href='/koleksiyon', while every canonical tag and
# every sitemap <loc> still points at the .htm form. Both forms return 200, so
# the canonical URLs received ZERO internal links — Ahrefs flagged all 41 pages
# as "Canonical URL has no incoming internal links" (crawl depth 0, discovered
# only via sitemap). Turning this off makes served links match canonical.
[build.processing.html]
  pretty_urls = false

# ─── Domain cutover: studioluminant.com → studioluminant.com.tr (permanent 301) ───
# .com still resolves to this Netlify site; force-redirect every old-domain
# request to the new domain, path-preserved, so the old domain stops serving
# duplicate content and consolidates to .com.tr.
[[redirects]]
  from = "https://studioluminant.com/*"
  to = "https://studioluminant.com.tr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.studioluminant.com/*"
  to = "https://studioluminant.com.tr/:splat"
  status = 301
  force = true

# Redirect www to non-www (canonical)
[[redirects]]
  from = "https://www.studioluminant.com.tr/*"
  to = "https://studioluminant.com.tr/:splat"
  status = 301
  force = true

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.facebook.com; connect-src 'self' https://mjmeqgljpyenuqorarte.supabase.co https://formspree.io https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://www.facebook.com https://connect.facebook.net; frame-src 'none'; form-action 'self' https://formspree.io; base-uri 'self'; object-src 'none'"

# Long cache for images (1 year, immutable content-hashed filenames)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache CSS/JS for 1 week (content changes with deploys)
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ─── Homepage rewrites (serve actual content at clean URLs) ───
# Fixes /en/ soft-404 in Google Search Console
# force = true overrides the existing index.html meta-refresh files
[[redirects]]
  from = "/"
  to = "/Studio Luminant — Özel Mimari Elemanlar.htm"
  status = 200
  force = true

[[redirects]]
  from = "/en"
  to = "/en/Studio Luminant — Bespoke Architectural Elements.htm"
  status = 200
  force = true

[[redirects]]
  from = "/en/"
  to = "/en/Studio Luminant — Bespoke Architectural Elements.htm"
  status = 200
  force = true

# ─── Long-filename homepage URLs → clean URLs ───
# Prevents Google from indexing the raw .htm filenames
[[redirects]]
  from = "/Studio Luminant — Özel Mimari Elemanlar.htm"
  to = "/"
  status = 301

[[redirects]]
  from = "/en/Studio Luminant — Bespoke Architectural Elements.htm"
  to = "/en/"
  status = 301

# ─── Duplicate-content consolidation ───
# anadolu-motifleri-duvar-paneli.htm was a near-identical clone (99.3% same body)
# of anadolu-motifleri-cagdas-rolyef.htm. Google had already chosen cagdas-rolyef
# as canonical (pos 6.0; the clone had zero impressions), so the clone folds into it.
[[redirects]]
  from = "/anadolu-motifleri-duvar-paneli.htm"
  to = "/anadolu-motifleri-cagdas-rolyef.htm"
  status = 301
  force = true

# ─── WordPress ghost URLs — 410 Gone ───
# Domain was previously WordPress; tell Google to drop these
[[redirects]]
  from = "/feed/*"
  to = "/404.html"
  status = 410

[[redirects]]
  from = "/wp-json/*"
  to = "/404.html"
  status = 410

[[redirects]]
  from = "/wp-content/*"
  to = "/404.html"
  status = 410

[[redirects]]
  from = "/wp-admin/*"
  to = "/404.html"
  status = 410

[[redirects]]
  from = "/wp-login.php"
  to = "/404.html"
  status = 410

[[redirects]]
  from = "/xmlrpc.php"
  to = "/404.html"
  status = 410

