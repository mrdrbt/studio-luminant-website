<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#edeeea">
<title>Atölye Tasarımları — Duvar kompozisyonu</title>
<link rel="icon" href="data:,">
<link rel="preload" href="fonts/jost-var-latin-tr.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="style.css?v=2b81cc16">
<link rel="modulepreload" href="lib/composer_layout.js?v=b748dc4d">
<link rel="modulepreload" href="price.js?v=59a918cf">
<link rel="modulepreload" href="light.js?v=aa3008dc">
<link rel="modulepreload" href="room_math.js?v=12f7cf55">
<link rel="modulepreload" href="material_rows.js?v=0082c530">
<link rel="modulepreload" href="box.js?v=c074f095">
<link rel="modulepreload" href="quote.js?v=4385aeff">
<link rel="preload" href="config.json" as="fetch" crossorigin>
<link rel="preload" href="strings.json" as="fetch" crossorigin>
<link rel="preload" href="kits/index.json" as="fetch" crossorigin>
<script>
  // The same rule as isQuoteMode in quote.js, set before the first paint so the page does not flash the whole composer.
  (function (p) {
    var m = p.get("mode");
    document.documentElement.dataset.mode = p.get("view") !== "client" && (m === "quote" || (m !== "full" && !p.get("c"))) ? "quote" : "full";
  })(new URLSearchParams(location.search));
</script>
<script src="lib/solar.js?v=4f22f0ee"></script>
<script src="lib/graze_shader.js?v=bd99247f"></script>
<script type="module" src="app.js?v=e5093472"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-diag-down" viewBox="0 0 24 24"><path d="M6 6l12 12M18 10v8h-8"/></symbol>
  <symbol id="i-diag-up" viewBox="0 0 24 24"><path d="M6 18L18 6M10 6h8v8"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v16M6 14l6 6 6-6"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><path d="M9 9h10v10H9zM5 15V5h10"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5M5 13v7h14v-7"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M10 6l6 6-6 6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-rev" viewBox="0 0 24 24"><path d="M12 3.5L21.5 20h-19z"/></symbol>
</svg>

<header class="bar">
  <h1 class="mark" data-s="title">Atölye Tasarımları</h1>
  <div class="lang" role="group" aria-label="TR / EN" data-aria="lang_group">
    <button type="button" data-lang="tr" lang="tr" aria-pressed="true">TR</button>
    <button type="button" data-lang="en" lang="en" aria-pressed="false">EN</button>
  </div>
</header>
<p class="lede" id="tagline" data-view="architect" data-full data-s="tagline"></p>
<p class="lede" id="quote-lede" data-view="architect" data-quote data-s="quote_lede"></p>
<p class="lede" id="quote-maker" data-view="architect" data-quote><span data-s="maker_label"></span>: <b data-s="maker_value"></b></p>
<p class="lede client-by" id="c-by-top" data-view="client"><span data-s="by_prefix"></span>: <b id="c-by"></b></p>
<div id="notice" class="notice" role="alert" hidden><span id="notice-text"></span><button type="button" id="copy-orig" class="btn" data-s="copy_orig" hidden></button></div>

<main class="frame">
  <div class="stage">
    <nav class="sheets-nav" id="sheets-nav" data-full data-aria="sheet_index">
      <a id="nav-a00" href="material.html" aria-current="false"><b>A-00</b><span data-s="sheet_a00"></span></a>
      <button type="button" data-pane="a01" aria-current="true"><b>A-01</b><span data-s="sheet_a01"></span></button>
      <button type="button" data-pane="a02" aria-current="false"><b>A-02</b><span data-s="sheet_a02"></span></button>
      <button type="button" data-pane="a03" aria-current="false" data-view="architect"><b>A-03</b><span data-s="sheet_a03"></span></button>
      <span class="fill"></span>
    </nav>

    <div class="strip" id="strip">
      <!-- A-01: the elevation, with the light that belongs to it -->
      <section class="pane a01" id="a01" aria-labelledby="a01-h">
        <h2 class="vh print-title" id="a01-h"><span>A-01 </span><span data-view="architect" data-s="print_title"></span><span data-view="client" data-s="sheet_a01"></span></h2>
        <div class="elev-wrap">
          <div class="elev" id="elev">
            <div id="wallbox" class="wallbox loading"><canvas id="gl" role="img"></canvas><div class="callout" id="callout" data-full hidden><b>A</b></div></div>
            <div class="dim dim-h" id="dim-h"><i class="tk"></i></div>
            <div class="dim dim-v" id="dim-v"><i class="tk"></i></div>
            <p class="dim-mod" id="dim-mod"></p>
            <div class="relief-dim" id="relief-dim" data-full hidden><div class="rd-bar" id="relief-bar" aria-hidden="true"></div><p class="rd-text" id="relief-dim-text"></p></div>
          </div>
          <div class="seeds-bar" id="seeds-bar" data-view="architect" hidden><p class="note" id="seeds-bar-hint" aria-hidden="true"></p><button type="button" class="btn" id="seeds-done" data-s="seeds_done"></button></div>
          <p class="dim-err" id="dim-err" data-full hidden></p>
          <p class="dim-fit" id="dim-fit" data-full hidden></p>
          <p class="elev-cap" data-full><b id="elev-title"></b><span id="depth-out"></span></p>
          <p class="note preview-note" id="preview-note" hidden></p>
          <p class="note ramp-cap" id="ramp-cap" data-full hidden></p>
          <div class="hours-row" data-full><p class="note relief-hours" id="relief-hours"></p><div class="print-row noprint"><button type="button" class="btn" id="print" data-s="print_button"></button></div></div>
          <p class="client-lede" data-view="client" data-s="client_lede"></p>
          <p id="light-status" class="note" data-full></p>
        </div>
        <div class="quick" id="quick" data-view="architect">
          <div class="q-designs" id="q-designs" role="group" data-aria="sec_design"></div>
          <div class="q-colours-row" data-full><div class="q-colours" id="q-finishes" role="group" data-aria="sec_finish"></div><span class="q-name" id="q-finish-name"></span></div>
          <p class="colours-note q-note" data-full data-s="finish_note"></p>
        </div>
        <figure class="detail" id="detail" data-full hidden>
          <div class="detail-box"><canvas id="gl-detail" role="img"></canvas></div>
          <figcaption class="detail-cap" id="detail-cap"></figcaption>
        </figure>
        <div class="sun" data-full>
          <div class="sun-head">
            <h2 class="h" data-s="sec_light"></h2>
            <output class="sun-time" id="hour-out" aria-live="off">--</output>
          </div>
          <div class="scrub">
            <div class="runs" id="runs" aria-hidden="true"></div>
            <div class="band" id="band" aria-hidden="true"></div>
            <input id="hour" type="range" min="0" max="24" step="0.25" value="16" data-aria="hour_label">
            <div class="ticks" id="ticks" aria-hidden="true"></div>
          </div>
          <details class="box" id="box-place" data-box="place">
            <summary><h3 class="h" data-s="sec_place"></h3><span class="box-sum" id="place-sum"></span></summary>
            <div class="box-body">
              <div class="sun-sel">
                <label class="sel"><span class="sel-l" data-s="city_label"></span>
                  <span class="sel-box"><select id="city"></select><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-chev"/></svg></span></label>
                <label class="sel"><span class="sel-l" data-s="facing_label"></span>
                  <span class="sel-box"><select id="facing"></select><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-chev"/></svg></span></label>
              </div>
              <p class="sun-read"><span id="sun-out"></span> · <span id="date-out"></span></p>
              <p id="light-note" class="note"></p>
              <p class="note light-basis" data-s="light_basis"></p>
            </div>
          </details>
        </div>
      </section>

      <!-- A-02: the room sheets (room.html) -->
      <section class="pane" id="a02" data-full aria-labelledby="a02-h">
        <h2 class="h pane-head" id="a02-h"><span>A-02 </span><span data-s="sheet_a02"></span></h2>
        <p class="pane-lede" id="a02-cap"></p>
        <ul class="idx" id="rooms-idx"></ul>
      </section>

      <!-- A-03: the laying map (laying.html) -->
      <section class="pane" id="a03" data-view="architect" data-full aria-labelledby="a03-h">
        <h2 class="h pane-head" id="a03-h"><span>A-03 </span><span data-s="sheet_a03"></span></h2>
        <p class="pane-lede" data-s="a03_lede"></p>
        <div class="grid-wrap" id="lay-mini-box"></div>
        <p class="pieces" id="lay-pieces"></p>
        <a class="open-link" id="lay-open" href="laying.html"><span data-s="a03_open"></span><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-next"/></svg></a>
      </section>
    </div>
  </div>

  <div class="sheet" id="sheet">
    <div class="dock" id="dock" data-view="architect" data-full></div>
    <section data-view="client" class="pr-send">
      <div class="field">
        <div class="field-head"><h2 class="h" data-s="client_sec_summary"></h2></div>
        <div class="antet">
          <dl>
            <div class="cell"><dt data-s="sec_design"></dt><dd id="c-design"></dd></div>
            <div class="cell r"><dt data-s="sec_finish"></dt><dd id="c-colour"></dd></div>
            <div class="cell span"><dt data-s="sec_size"></dt><dd id="c-size"></dd></div>
            <div class="cell span set-cell"><dt data-s="sheet_index_client"></dt><dd class="set" id="c-set"></dd></div>
            <div class="cell span maker"><dt data-s="maker_label"></dt><dd data-s="maker_value"></dd></div>
          </dl>
        </div>
      </div>
    </section>

    <section data-view="client" class="pr-price">
      <div class="field">
        <div class="field-head"><h2 class="h" data-s="client_sec_story"></h2></div>
        <p class="story" data-s="client_story_body"></p>
        <p class="client-next" id="c-next"></p>
      </div>
    </section>

    <section data-view="architect" class="noprint">
      <div class="field dc">
        <div class="field-head"><h2 class="h" data-s="sec_design"></h2></div>
        <div id="designs" class="rows-pick"></div>
      </div>
      <div class="field dc" data-full>
        <div class="field-head"><h2 class="h" data-s="sec_finish"></h2><span class="field-val" id="finish-val"></span></div>
        <div id="finishes" class="rows-pick"></div>
        <p id="finish-note" class="colours-note" data-s="finish_note"></p>
      </div>
    </section>

    <section data-view="architect" class="noprint" data-full>
      <details class="field box" id="box-layout" data-box="layout">
        <summary><h2 class="h" data-s="sec_layout"></h2><span class="box-sum" id="layout-sum"></span></summary>
        <div class="box-body">
        <div id="layout-corners">
          <p class="sub" data-s="layout_ramp"></p>
          <div id="presets" class="ibs"></div>
          <div class="row-step" id="offset-row">
            <span class="sub" data-s="layout_offset"></span>
            <div class="ctl">
              <button type="button" class="step" id="offset-minus" data-aria="offset_dec"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-minus"/></svg></button>
              <output id="offset-val">0</output>
              <button type="button" class="step" id="offset-plus" data-aria="offset_inc"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-plus"/></svg></button>
            </div>
          </div>
          <div class="seeds" id="seeds">
            <p class="sub" id="seeds-label" data-s="seeds_label"></p>
            <p class="note seeds-lede" data-s="seeds_lede"></p>
            <button type="button" class="btn seeds-toggle" id="seeds-toggle" aria-pressed="false" aria-controls="seeds-panel" data-s="seeds_edit"></button>
            <div class="seeds-panel" id="seeds-panel" hidden>
              <p class="note" id="seeds-help" data-s="seeds_help"></p>
              <p class="note seeds-status" id="seeds-status"></p>
              <ul class="seeds-list" id="seeds-list" aria-labelledby="seeds-label" aria-describedby="seeds-keys"></ul>
              <p class="note" id="seeds-keys" data-s="seeds_keys"></p>
              <button type="button" class="btn" id="seed-add" data-s="seed_add"></button>
            </div>
          </div>
        </div>
        <div id="layout-bond" hidden>
          <p class="sub" data-s="layout_bond"></p>
          <div id="bonds" class="segs"></div>
          <p class="sub" data-s="layout_rotate"></p>
          <div id="rotates" class="segs"></div>
          <button type="button" id="reshuffle" class="btn" data-s="reshuffle" hidden></button>
        </div>
        <p id="layout-plan" class="sub" data-s="layout_plan" hidden></p>
        </div>
      </details>
    </section>

    <section data-view="architect" class="pr-price" data-full>
      <div class="field">
        <div class="field-head"><h2 class="h" data-s="sec_price"></h2></div>
        <div id="price"></div>
      </div>
    </section>

    <section data-view="architect" class="noprint">
      <div class="field" id="quote" tabindex="-1">
        <div class="field-head"><h2 class="h" id="q-head"></h2></div>
        <div class="q-wall" id="q-wall">
          <label class="qf"><span data-s="dim_w_label"></span><input id="q-w" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="next" spellcheck="false" aria-describedby="q-dim-err"></label>
          <label class="qf"><span data-s="dim_h_label"></span><input id="q-h" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" spellcheck="false" aria-describedby="q-dim-err"></label>
        </div>
        <p class="dim-err" id="q-dim-err" data-quote hidden></p>
        <p class="note" id="q-block" hidden></p>
        <div id="q-sum"></div>
        <p class="note" id="q-lead"></p>
        <form id="quote-form" class="q-form" novalidate>
          <label class="qf"><span data-s="quote_name"></span><input id="q-name" name="name" type="text" autocomplete="name" maxlength="120" required aria-describedby="q-err-name"><small class="qf-err" id="q-err-name" hidden></small></label>
          <label class="qf"><span data-s="quote_email"></span><input id="q-email" name="email" type="email" inputmode="email" autocomplete="email" maxlength="160" required aria-describedby="q-err-email"><small class="qf-err" id="q-err-email" hidden></small></label>
          <fieldset class="qf-buyer" id="q-buyer" aria-describedby="q-err-buyer">
            <legend data-s="quote_buyer"></legend>
            <label><input type="radio" name="buyer" value="firm"><span data-s="quote_buyer_firm"></span></label>
            <label><input type="radio" name="buyer" value="person"><span data-s="quote_buyer_person"></span></label>
            <small class="qf-err" id="q-err-buyer" hidden></small>
          </fieldset>
          <label class="qf"><span data-s="quote_company"></span><input id="q-company" name="company" type="text" autocomplete="organization" maxlength="160" aria-describedby="q-err-company"><small class="qf-err" id="q-err-company" hidden></small></label>
          <label class="qf"><span data-s="quote_phone"></span><input id="q-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="40" required aria-describedby="q-err-phone"><small class="qf-err" id="q-err-phone" hidden></small></label>
          <label class="qf"><span data-s="quote_note"></span><textarea id="q-note" name="note" rows="2" maxlength="1000"></textarea></label>
          <div class="vh" aria-hidden="true"><label>Website<input name="_gotcha" type="text" tabindex="-1" autocomplete="off"></label></div>
          <label class="qf-check"><input id="q-consent" name="consent" type="checkbox"><span id="q-consent-text"></span></label>
          <p class="note qf-hint" data-s="quote_consent_hint"></p>
          <button type="submit" class="act primary q-submit" id="q-submit"></button>
          <p class="note qf-hint" id="q-privacy"></p>
          <p class="dim-err" id="q-status" role="status" aria-live="polite" tabindex="-1" hidden></p>
        </form>
        <div class="q-done" id="q-done" tabindex="-1" hidden>
          <h3 class="h" data-s="quote_done_head"></h3>
          <p id="q-done-body"></p>
          <p class="note" id="q-done-sample"></p>
          <button type="button" class="btn" id="q-again" data-s="quote_again"></button>
        </div>
        <button type="button" class="q-explore" id="q-explore" data-quote><span data-s="quote_explore"></span><small data-s="quote_explore_sub"></small></button>
      </div>
    </section>

    <section data-view="architect" class="pr-send" data-full>
      <div class="field" id="send" tabindex="-1">
        <div class="field-head"><h2 class="h" data-s="sec_send"></h2></div>
        <div class="antet" id="antet">
          <dl>
            <div class="cell span code"><dt data-s="send_code_label"></dt>
              <dd><span id="code" class="code-v" tabindex="0" role="textbox" aria-readonly="true" data-aria="send_code_label"></span><button type="button" id="copy-code" data-aria="send_copy_code"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-copy"/></svg></button></dd></div>
            <div class="cell"><dt data-s="sec_design"></dt><dd id="a-design"></dd></div>
            <div class="cell r"><dt data-s="sec_finish"></dt><dd id="a-colour"></dd></div>
            <div class="cell"><dt data-s="sec_size"></dt><dd id="a-size"></dd></div>
            <div class="cell r"><dt data-s="price_area"></dt><dd id="a-area"></dd></div>
            <div class="cell"><dt data-s="antet_lead"></dt><dd id="a-lead"></dd></div>
            <div class="cell r total" id="a-total-cell"><dt id="a-total-l"></dt><dd id="a-total"></dd></div>
            <div class="cell span set-cell"><dt data-s="sheet_index"></dt><dd class="set" id="a-set"></dd></div>
            <div class="cell span maker"><dt data-s="maker_label"></dt><dd data-s="maker_value"></dd></div>
          </dl>
          <div class="antet-act">
            <a class="act primary" id="ig" target="_blank" rel="noopener" data-s="send_instagram" href="#"></a>
            <button type="button" class="act" id="copy-msg"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-copy"/></svg><span data-s="send_copy_msg"></span></button>
            <label class="by wide"><span data-s="by_label"></span><input id="by" type="text" maxlength="60" autocomplete="off" enterkeyhint="done"></label>
            <button type="button" class="act wide" id="share-client"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-share"/></svg><span data-s="share_client"></span></button>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>
<footer class="maker-foot"><span data-s="maker_label"></span>: <b data-s="maker_value"></b></footer>

<div id="toast" class="toast" hidden></div>
<div id="live" class="vh" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
